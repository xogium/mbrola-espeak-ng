name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (no native code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # NVDA 2026.x runs Python 3.13
      - run: python -m pip install pytest
      - run: python -m pytest -m "not e2e" -q

  linux-harness:
    name: Build native libraries (Linux test harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: python tools/build_native.py --target linux-harness --work-dir build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-stage
          path: build/linux-stage

  windows-native:
    name: Build native libraries (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build mbrola.dll and espeak-ng-mbrola.dll
        run: python tools/build_native.py --target windows --work-dir build --stage-dir build/windows-stage
      - name: Check both DLLs are 64-bit
        run: python tools/check_pe_arch.py build/windows-stage/bin/mbrola.dll build/windows-stage/bin/espeak-ng-mbrola.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-stage
          path: build/windows-stage

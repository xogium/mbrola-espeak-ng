name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (no native code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # NVDA 2026.x runs Python 3.13
      - run: python -m pip install pytest
      - run: python -m pytest -m "not e2e" -q

  linux-harness:
    name: Build native libraries (Linux test harness) + end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: python tools/build_native.py --target linux-harness --work-dir build
      - name: Fetch test voices (en1, us1) - used only for testing, never committed
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/numediart/MBROLA-voices.git test-voices
          git -C test-voices sparse-checkout set data/en1 data/us1
      - run: python -m pip install pytest
      - name: End-to-end tests (real eSpeak NG + MBROLA, 64-bit)
        env:
          MBROLA_ESPEAK_STAGE: build/linux-stage
          MBROLA_TEST_VOICES: test-voices/data
        run: python -m pytest -m e2e -v
      - uses: actions/upload-artifact@v4
        with:
          name: linux-stage
          path: build/linux-stage

  windows-native:
    name: Build native libraries (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build mbrola.dll and espeak-ng-mbrola.dll
        run: python tools/build_native.py --target windows --work-dir build --stage-dir build/windows-stage
      - name: Check both DLLs are 64-bit
        run: python tools/check_pe_arch.py build/windows-stage/bin/mbrola.dll build/windows-stage/bin/espeak-ng-mbrola.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-stage
          path: build/windows-stage

name: CI

on:
  # Pull-request branches are tested by the pull_request event; only main needs push runs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (no native code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # NVDA 2026.x runs Python 3.13
      - run: python -m pip install pytest
      - run: python -m pytest -m "not e2e" -q

  linux-harness:
    name: Build native libraries (Linux test harness) + end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: python tools/build_native.py --target linux-harness --work-dir build
      - name: Fetch test voices (en1, us1, fr1) - used only for testing, never committed
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/numediart/MBROLA-voices.git test-voices
          git -C test-voices sparse-checkout set data/en1 data/us1 data/fr1
      - run: python -m pip install pytest
      - name: End-to-end tests (real eSpeak NG + MBROLA, 64-bit)
        env:
          MBROLA_ESPEAK_STAGE: build/linux-stage
          MBROLA_TEST_VOICES: test-voices/data
        run: python -m pytest -m e2e -v
      - uses: actions/upload-artifact@v4
        with:
          name: linux-stage
          path: build/linux-stage

  windows-native:
    name: Build native libraries (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build mbrola.dll and espeak-ng-mbrola.dll
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python tools/build_native.py --target windows --work-dir build --stage-dir build/windows-stage 2>&1 | tee build/native-build.log
      - name: Keep the build log if the build failed (download it from the run's Artifacts)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: |
            build/native-build.log
            build/windows/**/CMakeFiles/CMakeError.log
            build/windows/**/CMakeFiles/CMakeOutput.log
            build/windows/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
      - name: Check both DLLs are 64-bit
        run: python tools/check_pe_arch.py build/windows-stage/bin/mbrola.dll build/windows-stage/bin/espeak-ng-mbrola.dll
      - name: Smoke-test the DLLs from 64-bit Python (load, initialize, list MBROLA voices)
        shell: bash
        run: |
          python -c "
          import sys; sys.path.insert(0, 'addon/synthDrivers/mbrola_espeak')
          from pathlib import Path
          from core.espeak_binding import EspeakBinding
          from core.voice_catalog import VoiceCatalog
          s = Path('build/windows-stage')
          b = EspeakBinding(s/'bin/espeak-ng-mbrola.dll', s/'bin/mbrola.dll', s)
          print('eSpeak NG', b.version(), 'rate', b.sample_rate())
          assert len(VoiceCatalog.load(s/'espeak-ng-data/voices/mb').definitions) > 80
          assert (s/'espeak-ng-data/mbrola_ph/en1_phtrans').is_file()
          b.terminate()
          "
      - name: Speak with a real MBROLA voice on Windows x64
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/numediart/MBROLA-voices.git test-voices
          git -C test-voices sparse-checkout set data/en1 data/us1 data/fr1
          python -m pip install pytest
          MBROLA_ESPEAK_STAGE=build/windows-stage MBROLA_TEST_VOICES=test-voices/data python -m pytest -m e2e -v
      - name: Package the add-on
        shell: bash
        run: |
          cp -r build/windows-stage/bin build/windows-stage/espeak-ng-data addon/synthDrivers/mbrola_espeak/
          python tools/build_addon.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: dist/*.nvda-addon
